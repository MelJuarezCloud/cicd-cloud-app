name: CI/CD Pipeline - Node.js Web App

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------
  # CALIDAD: Lint
  # ---------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter (ESLint)
        run: npm run lint --if-present

  # ---------------------------------------------------------
  # CALIDAD: Pruebas unitarias
  # ---------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test --if-present

  # ---------------------------------------------------------
  # BUILD
  # ---------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        run: npm run build --if-present

  # ---------------------------------------------------------
  # DEPLOY A DEV
  # ---------------------------------------------------------
  deploy-dev:
    name: Deploy Dev (Preview)
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Obtener configuración Preview
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Generar Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Preview
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Preview URL: $url"
          echo "Preview URL: $url" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------
  # DEPLOY A PRODUCCIÓN
  # ---------------------------------------------------------
  deploy-prod:
    name: Deploy Producción
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Obtener configuración Producción
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Generar Build Producción
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Producción
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Production URL: $url"
          echo "Production URL: $url" >> $GITHUB_STEP_SUMMARY
