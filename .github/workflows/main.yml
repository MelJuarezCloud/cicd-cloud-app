name: CI/CD Pipeline - Node.js Web App

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      simular_error:
        description: "Simular un error de despliegue (solo para pruebas)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # CALIDAD: Lint
  # ---------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter (ESLint)
        run: npm run lint

  # ---------------------------------------------------------
  # CALIDAD: Pruebas unitarias (matrix de versiones de Node)
  # ---------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con cobertura (Jest)
        run: npm test -- --coverage

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  # ---------------------------------------------------------
  # BUILD
  # ---------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación (genera dist/ y valida la página)
        run: npm run build

      - name: Guardar artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------
  # DEPLOY A DEV (entorno de pruebas, push a dev o ejecución manual en dev)
  # ---------------------------------------------------------
  deploy-dev:
    name: Deploy Dev (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Extraer entorno de Vercel (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Compilar para Vercel
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Simular error de despliegue (solo ejecución manual)
        if: github.event_name == 'workflow_dispatch' && inputs.simular_error
        run: |
          echo "Error simulado para la prueba de escenario 4"
          exit 1

      - name: Desplegar a Vercel (con reintentos) y smoke test
        run: |
          url=""
          for i in 1 2 3; do
            if url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN"); then break; fi
            echo "Intento $i falló, reintentando en 10s..."
            sleep 10
          done
          [ -n "$url" ] || { echo "El deploy falló tras 3 intentos"; exit 1; }
          echo "URL de dev: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke test: $url"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          salud=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/health.json")
          echo "$salud" | grep -q '"status": "ok"'
          echo "Smoke test correcto" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------
  # DEPLOY A PRODUCCIÓN (solo push a main)
  # ---------------------------------------------------------
  deploy-prod:
    name: Deploy Producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Extraer entorno de Vercel (producción)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Compilar para producción
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Desplegar a producción (con reintentos) y smoke test
        run: |
          url=""
          for i in 1 2 3; do
            if url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"); then break; fi
            echo "Intento $i falló, reintentando en 10s..."
            sleep 10
          done
          [ -n "$url" ] || { echo "El deploy falló tras 3 intentos"; exit 1; }
          echo "URL de producción: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke test: $url"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          salud=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/health.json")
          echo "$salud" | grep -q '"status": "ok"'
          echo "Smoke test correcto" >> "$GITHUB_STEP_SUMMARY"
