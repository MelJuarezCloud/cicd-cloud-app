name: Health Check (disponibilidad)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Verificar producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Consultar health.json
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Falta la variable SITE_URL"
            exit 1
          fi
          resultado=$(curl --silent --show-error --output /tmp/health.json --write-out "%{http_code} %{time_total}" "$SITE_URL/health.json")
          codigo=$(echo "$resultado" | cut -d' ' -f1)
          tiempo=$(echo "$resultado" | cut -d' ' -f2)
          {
            echo "### Health check"
            echo "- URL: $SITE_URL/health.json"
            echo "- Código HTTP: $codigo"
            echo "- Tiempo de respuesta: ${tiempo}s"
            echo "- Fecha (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$codigo" != "200" ]; then
            echo "Fallo: código HTTP $codigo"
            exit 1
          fi
          grep -q '"status": "ok"' /tmp/health.json || { echo "Fallo: respuesta sin status ok"; exit 1; }
          echo "Servicio disponible"
